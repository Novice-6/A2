<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration | Green Tomorrow</title><link rel="icon" href="/assets/favicon.ico"><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><meta property="og:image" content="/assets/og.jpg"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/event.css"><link rel="stylesheet" href="css/theme-a.css"></head><body><a class="skip-link" href="#main">Skip to main content</a><header class="site-header"><nav class="nav container" aria-label="Main navigation"><a class="brand" href="index.html"><span class="brand-mark"><img src="/assets/logo.svg" alt="" width="160" height="40"></span>Green Tomorrow</a></nav></header><main id="main" class="page-section"><div class="container" id="registration-summary"><div class="state">Loading event…</div></div></main><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id'),root=document.querySelector('#registration-summary');if(!id)return showState(root,'Event ID is missing.');try{const event=await api('/api/events/'+encodeURIComponent(id));root.innerHTML='<span class="eyebrow">Registration</span><h1>'+event.title+'</h1>'+(event.image?'<img class="summary-media" src="/assets/'+encodeURIComponent(event.image)+'" alt="">':'')+'<p>'+event.date+' · '+event.location+'</p><p><a class="button secondary" href="event.html?id='+event.id+'">Back to event</a></p>'}catch{showState(root,'Event information could not load.')}})</script></body></html>
